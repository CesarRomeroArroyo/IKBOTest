name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Verify SDK and project versions
        shell: bash
        run: |
          test -f global.json
          test "$(dotnet --version)" = "8.0.403"
          test -z "$(find src tests -name '*.csproj' -print0 | xargs -0 grep -L '<TargetFramework>net8.0</TargetFramework>')"
          ! grep -R -E 'Microsoft\.EntityFrameworkCore[^<]*Version="(9|10)\.' --include='*.csproj' src tests

      - name: Restore
        run: dotnet restore ProductRequests.sln

      - name: Build Release
        run: dotnet build ProductRequests.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test ProductRequests.sln --configuration Release --no-build --logger "trx;LogFilePrefix=tests"

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7
